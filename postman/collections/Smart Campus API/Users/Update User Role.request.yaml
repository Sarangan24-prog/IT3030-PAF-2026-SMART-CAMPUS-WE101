$kind: http-request
method: PUT
url: '{{baseUrl}}/api/users/:id/role'
order: 2000
headers:
  - key: 'Authorization'
    value: 'Bearer {{jwtToken}}'
  - key: 'Content-Type'
    value: 'application/json'
pathVariables:
  - key: id
    value: '1'
body:
  type: json
  content: |-
    {
      "role": "TECHNICIAN"
    }
