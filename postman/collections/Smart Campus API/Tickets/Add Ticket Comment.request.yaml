$kind: http-request
method: POST
url: '{{baseUrl}}/api/tickets/:id/comments'
order: 6000
headers:
  - key: 'Authorization'
    value: 'Bearer {{jwtToken}}'
  - key: 'Content-Type'
    value: 'application/json'
pathVariables:
  - key: id
    value: '1'
body:
  type: json
  content: |-
    {
      "comment": "We have scheduled a technician visit for tomorrow morning."
    }
