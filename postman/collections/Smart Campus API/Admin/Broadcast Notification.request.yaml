$kind: http-request
method: POST
url: '{{baseUrl}}/api/admin/notifications/broadcast'
order: 4000
headers:
  - key: 'Authorization'
    value: 'Bearer {{jwtToken}}'
  - key: 'Content-Type'
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "title": "Emergency Alert",
      "message": "Please avoid the main auditorium area until further notice.",
      "type": "NEW_COMMENT"
    }
