$kind: http-request
method: PUT
url: '{{baseUrl}}/api/bookings/:id/status'
order: 5000
headers:
  - key: 'Authorization'
    value: 'Bearer {{jwtToken}}'
  - key: 'Content-Type'
    value: 'application/json'
pathVariables:
  - key: id
    value: '1'
body:
  type: json
  content: |-
    {
      "status": "APPROVED"
    }
